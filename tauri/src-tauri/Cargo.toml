[package]
name = "youmusicflow-tauri-spike"
version = "0.1.0"
description = "YouMusicFlow Tauri 2 spike — frameless tray wrapper around music.youtube.com"
edition = "2021"

[lib]
name = "youmusicflow_tauri_spike_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString"] }
objc2-web-kit = { version = "0.3", features = [
  "WKContentRuleList",
  "WKContentRuleListStore",
  "WKFrameInfo",
  "WKNavigationAction",
  "WKNavigationDelegate",
  "WKUserContentController",
  "WKWebView",
  "WKWebViewConfiguration",
  "block2",
  "std",
] }

[dev-dependencies]
serde_json = "1"
